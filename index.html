<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary: browser tab + search engines -->
    <title>Git Cheat Sheet: All Git Commands in One Place</title>
    <meta name="description" content="Git Cheat Sheet. Dedicated to making developers' lives easier: all Git commands in one place." />
    <meta name="author" content="Katy Rosli" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="mYg6b9VmToaJ07QMDBthps8Vtf6ANaOyOON2Z_iLY04" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#111322" />

    <!-- Open Graph: link previews in WhatsApp, Slack, LinkedIn, Facebook, Discord… -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Git Cheat Sheet" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Git Cheat Sheet" />
    <meta property="og:description" content="Dedicated to making developers' lives easier: all Git commands in one place." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Git Cheat Sheet — all Git commands in one place" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Git Cheat Sheet" />
    <meta name="twitter:description" content="Dedicated to making developers' lives easier: all Git commands in one place." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Git Cheat Sheet — all Git commands in one place" />

    <!-- Structured data: helps search engines and AI agents understand the page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Git Cheat Sheet",
        "url": "%SITE_URL%/",
        "description": "Dedicated to making developers' lives easier: all Git commands in one place.",
        "image": "%SITE_URL%/og-image.png",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Katy Rosli", "url": "https://github.com/katyrosli" },
        "keywords": "git, git commands, git cheat sheet, version control, git reference"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <!-- Full content for crawlers and AI agents that don't run JavaScript (filled at build time
         by build/seo.ts). React replaces it on load. -->
    <div id="root">
      <main>
        <h1>Git Cheat Sheet</h1>
        <p>Dedicated to making developers' lives easier: all Git commands in one place.</p>
        <!--prerendered-commands-->
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
